<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace Fee & Margin Benchmark Database — interactive dashboard</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
h1{font-size:22px;margin:0 0 4px} p{color:#94a3b8;margin:0 0 16px}
.cards{display:flex;gap:12px;margin-bottom:16px}
.cards div{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px 18px}
.cards b{display:block;font-size:24px;color:#22d3ee} .cards span{font-size:12px;color:#94a3b8}
input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1e293b;color:#7dd3fc;text-align:left;padding:8px 10px;border-bottom:1px solid #334155;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #1e293b;vertical-align:top}
tr:hover td{background:#1e293b}
.note{color:#fbbf24;font-size:12px;margin-top:14px}
a{color:#38bdf8}
</style></head><body>
<h1>Marketplace Fee & Margin Benchmark Database</h1><p>Autonomous Studio · interactive reference dashboard · works offline</p>

    <div class="cards">
      <div><b>12</b><span>verified entries</span></div>
      <div><b>11</b><span>specialist fields</span></div>
      <div><b>2026-11</b><span>compiled compiled</span></div>
    </div>
<input id="q" placeholder="Search...">
<table id="t"><thead></thead><tbody></tbody></table>
<div class="note">Indicative fee structures — every marketplace links its official fee page.</div>
<script>
const DATA = [{"marketplace": "Amazon (Professional)", "model": "1P/3P marketplace", "category_scope": "Most categories (referral varies 8-15%; some 45%+ on device accessories)", "referral_fee_pct": "8-15% typical (category-dependent)", "listing_or_subscription": "$39.99/mo professional seller plan", "payment_processing": "No separate processing fee (included in referral)", "fulfilment_fees": "FBA: pick&pack + storage + optional prep (per-unit, size-tiered)", "ad_cost_model": "Sponsored Products (CPC bids)", "notes": "Largest reach; referral + FBA drive real all-in cost", "official_fees_url": "https://sell.amazon.com/pricing", "status_stamp": "compiled 2026-11"}, {"marketplace": "Amazon (Individual)", "model": "1P/3P marketplace", "category_scope": "Per-item selling", "referral_fee_pct": "8-15% typical", "listing_or_subscription": "$0.99 per item sold", "payment_processing": "Included", "fulfilment_fees": "FBA optional (per-unit)", "ad_cost_model": "Sponsored Products (CPC)", "notes": "No monthly fee; per-item fee eats thin margins", "official_fees_url": "https://sell.amazon.com/pricing", "status_stamp": "compiled 2026-11"}, {"marketplace": "eBay", "model": "C2C/B2C marketplace", "category_scope": "Most categories (final value fee varies)", "referral_fee_pct": "~13.6% typical for most categories (up to ~15% w/ fees)", "listing_or_subscription": "Free up to 250 fixed-price listings/mo (then insertion fees)", "payment_processing": "Included in final value fee", "fulfilment_fees": "No first-party fulfilment; seller ships", "ad_cost_model": "Promoted Listings (ad rate %)", "notes": "Auction + fixed price; store subscription reduces fees", "official_fees_url": "https://www.ebay.com/help/selling/fees-credits-invoices/store-selling-fees", "status_stamp": "compiled 2026-11"}, {"marketplace": "Walmart Marketplace", "model": "3P marketplace", "category_scope": "Most categories", "referral_fee_pct": "~6-15% (category referral)", "listing_or_subscription": "Free to list", "paym ", "model": "Social commerce", "category_scope": "Physical goods (commerce-eligible)", "referral_fee_pct": "5% selling fee on shipped orders (US)", "listing_or_subscription": "Free to list", "payment_processing": "Handled by Meta checkout", "fulfilment_fees": "Seller ships (or local pickup)", "ad_cost_model": "Meta Ads (CPM/CPC)", "notes": "Local pickup free; shipping incurs 5% + payment", "official_fees_url": "https://www.facebook.com/business/help/1196991325293221", "status_stamp": "compiled 2026-11"}, {"marketplace": "Etsy + Pattern (own site)", "model": "Marketplace + D2C", "category_scope": "Creative goods", "referral_fee_pct": "6.5% transaction + Pattern subscription", "listing_or_subscription": "$0.20/listing + Pattern ~$15/mo", "payment_processing": "Processing ~3% + $0.25", "fulfilment_fees": "N/A", "ad_cost_model": "Etsy Ads", "notes": "Pattern = standalone site powered by Etsy", "official_fees_url": "https://www.etsy.com/legal/fees/", "status_stamp": "compiled 2026-11"}, {"marketplace": "Alibaba (supplier side)", "model": "B2B wholesale", "category_scope": "Wholesale/manufacturing", "referral_fee_pct": "Membership-based (Gold Supplier) not per-sale referral", "listing_or_subscription": "Gold Supplier membership tiers", "payment_processing": "Trade Assurance processing fees", "fulfilment_fees": "N/A (supplier ships)", "ad_cost_model": "P4P ads (pay-per-click)", "notes": "Buyer-side free; supplier pays membership + P4P", "official_fees_url": "https://sell.alibaba.com/", "status_stamp": "compiled 2026-11"}, {"marketplace": "Mercado Libre", "model": "LatAm marketplace", "category_scope": "Most categories", "referral_fee_pct": "~13-16% (category + listing type dependent)", "listing_or_subscription": "Free basic listings; optional featured upgrades", "payment_processing": "Mercado Pago processing (~varies)", "fulfilment_fees": "Mercado Envíos (fulfilment) optional", "ad_cost_model": "Product Ads (CPC)", "notes": "Dominant in LatAm; fees + shipping interplay", "official_fees_url": "https://vendedores.mercadolibre.com/", "status_stamp": "compiled 2026-11"}, {"marketplace": "Rakuten (US)", "model": "3P marketplace", "category_scope": "Most categories", "referral_fee_pct": "~8-15% (category)", "listing_or_subscription": "Monthly plan optional", "payment_processing": "Included", "fulfilment_fees": "Rakuten Fulfillment optional", "ad_cost_model": "Rakuten Advertising", "notes": "Japan/LatAm variants differ strongly", "official_fees_url": "https://rakutenadvertising.com/", "status_stamp": "compiled 2026-11"}];
const COLS = ["marketplace", "model", "category_scope", "referral_fee_pct", "listing_or_subscription", "payment_processing", "fulfilment_fees", "ad_cost_model", "notes", "official_fees_url", "status_stamp"];
const tbody = document.querySelector('#t tbody'), thead = document.querySelector('#t thead');
thead.innerHTML = '<tr>' + COLS.map(c=>'<th>'+c+'</th>').join('') + '</tr>';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function link(v){const s=String(v??'');return /^https?:\/\//.test(s)?'<a href="'+s+'" target="_blank" rel="noopener">'+(s.length>46?s.slice(0,46)+'…':s)+'</a>':esc(v);}
function draw(f=''){
  const q=f.toLowerCase(); const rs=DATA.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
  tbody.innerHTML = rs.map(r=>'<tr>'+COLS.map(c=>{const v=r[c];const isUrl=(c==='official_url'||c==='official_fees_url'||c==='direct_download_url');return '<td>'+(isUrl?link(v):esc(v))+'</td>';}).join('')+'</tr>').join('')
    || '<tr><td colspan="'+COLS.length+'">No matches.</td></tr>';
}
document.getElementById('q').addEventListener('input', e=>draw(e.target.value));
draw();
</script></body></html>
